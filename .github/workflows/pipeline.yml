name: NFL Quantitative Pipeline Sync

on:
  push:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests sqlalchemy psycopg2-binary nflreadpy openpyxl xgboost scipy google-genai

      - name: Run Madden Ratings Ingestion Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python team_ratings_engine.py

      - name: Run Live Slate Ingestion Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_nfl.py
